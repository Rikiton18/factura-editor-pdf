services:
  - type: web
    name: factura-editor-backend
    runtime: python
    rootDir: invoice-editor/backend
    buildCommand: apt-get install -y tesseract-ocr tesseract-ocr-spa && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
